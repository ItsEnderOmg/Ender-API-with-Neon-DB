<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gyaru</title> 
    <link rel="stylesheet" href="styles.css">   
</head>
<body>

        <div class="container">
        <h1>Gestión de Usuarios</h1>

        <!-- Formulario para crear usuario -->
        <div class="formulario">
            <h2>Crear Usuario</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="crear-btn">Crear Usuario</button>
        </div>

        <!-- Lista de usuarios -->
        <div class="usuarios-lista">
            <h2>Usuarios</h2>
            <button id="cargar-btn">Cargar Usuarios</button>
        </div>

        <div class="formulario">
            <h2>Eliminar Usuario</h2>
            <input type="number" id="user-id" placeholder="User-ID">
            <button id="delete-btn">Eliminar Usuario</button>
        </div>

        <!-- Formulario para actualizar usuario -->
        <div class="formulario">
            <h2>Actualizar Usuario</h2>
            <input type="number" id="user-update-id" placeholder="Id del usuario que quieres actualizar">
            <input type="text" id="update-username" placeholder="Nuevo Username (opcional)">
            <input type="email" id="update-email" placeholder="Nuevo Email (opcional)">
            <input type="password" id="update-password" placeholder="Nueva Password (opcional)">
            <button id="update-btn">Actualizar Usuario</button>
        </div>

        <!-- Aqui se mostraran los usuarios en la db -->
        <div id="usuarios-contenedor"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
